apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  # No standalone ClusterIssuer here: nothing in this repo references one
  # (the ALB controller brings its own self-contained Issuer/Certificate in
  # modules/aws-load-balancer-controller/deployment.yaml). A ClusterIssuer
  # bundled with the webhook Deployment would also be rejected on a virgin
  # apply anyway, since the ValidatingWebhookConfiguration (failurePolicy:
  # Fail) isn't Ready yet to admit it.

# Regenerate with:
#   gh release download v1.21.3 --repo cert-manager/cert-manager \
#     --pattern cert-manager.yaml --output deployment.yaml --clobber
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  # No standalone ClusterIssuer here: nothing in this repo references one
  # (the ALB controller brings its own self-contained Issuer/Certificate in
  # modules/aws-load-balancer-controller/deployment.yaml). A ClusterIssuer
  # bundled with the webhook Deployment would also be rejected on a virgin
  # apply anyway, since the ValidatingWebhookConfiguration (failurePolicy:
  # Fail) isn't Ready yet to admit it.
images:
  - name: quay.io/jetstack/cert-manager-cainjector
    newName: ${ECR_REGISTRY}/${ENV_PREFIX}-cert-manager-cainjector
    newTag: 1.21.3
  - name: quay.io/jetstack/cert-manager-controller
    newName: ${ECR_REGISTRY}/${ENV_PREFIX}-cert-manager-controller
    newTag: 1.21.3
  - name: quay.io/jetstack/cert-manager-webhook
    newName: ${ECR_REGISTRY}/${ENV_PREFIX}-cert-manager-webhook
    newTag: 1.21.3
patches:
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cert-manager
      $patch: delete

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
spec:
  # No `replicas:` here on purpose: once flux/modules/keda-demo/scaledobject.yaml
  # is installed, its generated HorizontalPodAutoscaler owns this Deployment's
  # replica count. If this field were set, the sample-app Kustomization's
  # prune/reconcile would keep resetting it from git, fighting the HPA and
  # undoing every scale-up. Kubernetes defaults an unset `replicas` to 1 on
  # first creation, before KEDA/the HPA ever act on it.
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
    spec:
      containers:
        - name: web
          image: 228904764948.dkr.ecr.eu-west-1.amazonaws.com/nlaclassic-eu-west-1/sample-app:1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: fastapi-secret
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "500m"
              memory: "500Mi"

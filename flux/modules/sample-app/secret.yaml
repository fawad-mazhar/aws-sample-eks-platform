# NOTE: these are throwaway demo credentials committed in plaintext for this
# reference deployment ONLY — they exist purely so CloudNativePG's bootstrap
# and the sample app can authenticate against each other without any extra
# setup steps. Do NOT follow this pattern for a real deployment: generate
# random passwords and manage them with sealed-secrets (an image already
# built by this repo, see applications/sealed-secrets-controller/), External
# Secrets Operator, or SOPS instead of committing Secret manifests to git.
apiVersion: v1
kind: Secret
metadata:
  name: fastapi-secret
type: Opaque
stringData:
  DOCKER_DATABASE_URL: "postgresql://bookdbadmin:dbpassword@postgresql-rw:5432/bookstore"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-app-user
type: kubernetes.io/basic-auth
stringData:
  username: bookdbadmin
  password: dbpassword
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-superuser
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: postgres

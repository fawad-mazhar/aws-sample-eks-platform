apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
data:
  garage.toml: |
    # Metadata (small, frequent I/O) and data (bulk objects) are kept on
    # separate volumeClaimTemplates (see statefulset.yaml) per Garage's own
    # recommendation; these paths are the mount points of those two PVCs.
    metadata_dir = "/mnt/meta"
    data_dir = "/mnt/data"

    # LMDB is the default and fastest metadata engine since v0.9. It is
    # documented upstream as prone to metadata corruption after an unclean
    # shutdown; metadata_auto_snapshot_interval below is upstream's recommended
    # mitigation (a periodic consistent snapshot to recover from). The residual
    # risk is still called out in README.md Known Limitations.
    db_engine = "lmdb"
    metadata_auto_snapshot_interval = "6h"

    # 3 replicas of every object across the 3-node cluster, with the default
    # strong ("consistent") read/write quorum.
    replication_factor = 3
    consistency_mode = "consistent"

    # rpc_secret and admin_token are intentionally NOT set here -- they are
    # sourced from the garage-secrets Secret via the GARAGE_RPC_SECRET and
    # GARAGE_ADMIN_TOKEN env vars (see statefulset.yaml), keeping secret
    # material out of this non-secret ConfigMap.
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr_subnet = "0.0.0.0/0"

    # Peer discovery via Kubernetes. Node identities (Ed25519 keypairs) are
    # generated on first boot, so a static bootstrap_peers list can't be
    # pre-computed the way NATS's route list could; instead each node
    # publishes/discovers peers through the garagenodes.deuxfleurs.fr CR.
    # skip_crd = true because we pre-vendor that CRD ourselves (crds/), so
    # Garage does not need cluster-wide permission to create it at runtime.
    [kubernetes_discovery]
    namespace = "garage"
    service_name = "garage-rpc"
    skip_crd = true

    [s3_api]
    api_bind_addr = "[::]:3900"
    s3_region = "garage"
    root_domain = ".s3.garage.local"

    [admin]
    api_bind_addr = "[::]:3903"
    # metrics_token is deliberately left UNSET: an unset token means /metrics is
    # served unauthenticated, which is how this project's annotation-based
    # Prometheus scraping (prometheus.io/scrape, no bearer token) can read it.
    # Setting a token would silently break that scrape. Demo-only; see
    # README.md Known Limitations.

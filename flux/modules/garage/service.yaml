# garage-rpc: headless Service (clusterIP: None) -- gives the StatefulSet pods
# stable per-pod DNS and is the `service_name` referenced by
# [kubernetes_discovery] in garage.toml. It also exposes the admin/metrics
# port (3903) so Prometheus can resolve individual pods; scraping itself is
# driven by the prometheus.io/scrape pod annotations, not this Service.
apiVersion: v1
kind: Service
metadata:
  name: garage-rpc
  namespace: garage
  labels:
    app: garage
spec:
  clusterIP: None # headless -- required for StatefulSet pod DNS + peer discovery
  selector:
    app: garage
  ports:
    - name: rpc
      port: 3901
      targetPort: 3901
    - name: admin
      port: 3903
      targetPort: 3903
---
# garage-s3: ClusterIP Service load-balancing the S3 API (3900) across the
# three pods. This is the in-cluster S3 endpoint
# (garage-s3.garage.svc.cluster.local:3900). The s3_web static-website feature
# is intentionally left disabled -- out of scope for this showcase.
apiVersion: v1
kind: Service
metadata:
  name: garage-s3
  namespace: garage
  labels:
    app: garage
spec:
  type: ClusterIP
  selector:
    app: garage
  ports:
    - name: s3
      port: 3900
      targetPort: 3900

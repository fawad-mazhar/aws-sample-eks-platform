# DEMO SECRET MATERIAL -- checked into git, NOT for real use. Same
# "checked into git, not for production" caveat as flux/modules/nats's demo
# credentials: for a real deployment, source these from a secrets manager
# (sealed-secrets -- already available in this repo -- External Secrets
# Operator, or SOPS) rather than a plaintext checked-in Secret, and rotate.
#
# rpc_secret MUST be a valid 32-byte hex string (openssl rand -hex 32 -> 64
# hex chars); a human-readable placeholder makes Garage refuse to start, so
# the value below is a real generated hex string. Regenerate for real use.
apiVersion: v1
kind: Secret
metadata:
  name: garage-secrets
  namespace: garage
type: Opaque
stringData:
  # openssl rand -hex 32
  GARAGE_RPC_SECRET: "e5408d0e55bac9f10d1d3d10f505249c64c787560a95ea143dd9dda607ed831c"
  # openssl rand -hex 32
  GARAGE_ADMIN_TOKEN: "2b310c8d757c04c31d6af458a45ff9cc777bfdf2dafa2a3e4c0fca89dd9c6a5d"

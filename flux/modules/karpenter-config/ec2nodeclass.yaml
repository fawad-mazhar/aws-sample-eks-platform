apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: nlaclassic-eu-west-1-karpenter-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: nlaclassic-eu-west-1-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: nlaclassic-eu-west-1-eks
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

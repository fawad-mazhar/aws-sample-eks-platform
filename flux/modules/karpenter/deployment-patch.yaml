apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter
  namespace: autoscaling-system
spec:
  template:
    spec:
      containers:
        - name: controller
          env:
            - name: CLUSTER_NAME
              value: null
              valueFrom:
                configMapKeyRef:
                  name: cluster-information
                  key: cluster-name

replicas: 1

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"

nodeSelector:
  role: platform

settings:
  clusterName: configured-by-cluster-information

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::228904764948:role/nlaclassic-eu-west-1-karpenter

controller:
  image:
    repository: 228904764948.dkr.ecr.eu-west-1.amazonaws.com/nlaclassic-eu-west-1/karpenter
    tag: 1.15.2
    digest: ""
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
      ephemeral-storage: 100Mi
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 10Mi
  env:
    - name: CLUSTER_ENDPOINT
      valueFrom:
        configMapKeyRef:
          name: cluster-information
          key: cluster-endpoint
    - name: INTERRUPTION_QUEUE
      valueFrom:
        configMapKeyRef:
          name: cluster-information
          key: karpenter-queue

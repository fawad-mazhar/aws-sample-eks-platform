replicas: 1

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"

nodeSelector:
  role: platform

settings:
  clusterName: configured-by-cluster-information

# No serviceAccount role-arn annotation: the IAM role is bound through an
# EKS Pod Identity association in Terraform (aws/envs/eu-west-1).

controller:
  image:
    repository: ${ECR_REGISTRY}/${ENV_PREFIX}-karpenter
    tag: 1.15.2
    digest: ""
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
      ephemeral-storage: 100Mi
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 10Mi
  env:
    - name: CLUSTER_ENDPOINT
      valueFrom:
        configMapKeyRef:
          name: cluster-information
          key: cluster-endpoint
    - name: INTERRUPTION_QUEUE
      valueFrom:
        configMapKeyRef:
          name: cluster-information
          key: karpenter-queue

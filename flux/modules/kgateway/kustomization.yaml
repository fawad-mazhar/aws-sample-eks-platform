# Regenerate with:
#   helm template gloo gloo/gloo --version 1.22.8 \
#     --namespace gateway-system --values values.yaml > kgateway.yaml
#   helm show crds gloo/gloo --version 1.22.8 > crds/kgateway-crds.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crds
  - kgateway.yaml
images:
  - name: quay.io/solo-io/gloo
    newName: ${ECR_REGISTRY}/${ENV_PREFIX}/kgateway-gloo
    newTag: 1.22.8
  - name: quay.io/solo-io/discovery
    newName: ${ECR_REGISTRY}/${ENV_PREFIX}/kgateway-discovery
    newTag: 1.22.8
  - name: quay.io/solo-io/gloo-envoy-wrapper
    newName: ${ECR_REGISTRY}/${ENV_PREFIX}/kgateway-envoy
    newTag: 1.22.8
  - name: quay.io/solo-io/kubectl
    newName: ${ECR_REGISTRY}/${ENV_PREFIX}/kgateway-kubectl
    newTag: 1.22.8
# certgen stays on quay.io as a deliberate exception: it is not mirrored to ECR.
# Flux does not implement Helm hook semantics. Remove the chart's destructive
# upgrade/delete hooks so they are not applied as ordinary Jobs.
patches:
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: gloo-resource-cleanup
        namespace: gateway-system
      $patch: delete
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: gloo-resource-migration
        namespace: gateway-system
      $patch: delete
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: gloo-resource-rollout-cleanup
        namespace: gateway-system
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: gloo-resource-cleanup
        namespace: gateway-system
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: gloo-resource-migration
        namespace: gateway-system
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: gloo-resource-rollout-cleanup
        namespace: gateway-system
      $patch: delete
  - patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: gloo-resource-cleanup-support
      $patch: delete
  - patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: gloo-resource-migration-support
      $patch: delete
  - patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: gloo-resource-cleanup-support
      $patch: delete
  - patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: gloo-resource-migration-support
      $patch: delete
  - patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: gloo-resource-cleanup
        namespace: gateway-system
      $patch: delete
  - patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: gloo-resource-migration
        namespace: gateway-system
      $patch: delete
  - patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: gloo-resource-rollout-cleanup
        namespace: gateway-system
      $patch: delete
  - patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: gloo-resource-cleanup
        namespace: gateway-system
      $patch: delete
  - patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: gloo-resource-migration
        namespace: gateway-system
      $patch: delete
  - patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: gloo-resource-rollout-cleanup
        namespace: gateway-system
      $patch: delete

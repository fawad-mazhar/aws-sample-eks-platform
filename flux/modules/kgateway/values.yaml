# kgateway (Gloo Gateway) Helm values for eu-tst cluster
# Namespace: support
# Version: 1.20.9

# Global settings
namespace:
  create: false  # support namespace already exists

# Use internal ECR registry for main images
# Note: kubectl and certgen images need to be added to base-images repo
# Note: Solo.io Gloo Gateway v1.20.9 is x86_64 only (no ARM64 support)
#       Multi-arch support is only available in kgateway v2.x+
global:
  image:
    registry: 228904764948.dkr.ecr.eu-west-1.amazonaws.com/nlaclassic-eu-west-1

# Gloo controller
gloo:
  deployment:
    replicas: 2
    image:
      repository: kgateway-gloo
      tag: "1.20.9"
      pullPolicy: IfNotPresent
    resources:
      requests:
        memory: "263Mi"
        cpu: "50m"
      limits:
        memory: "263Mi"
        cpu: "200m"
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - gloo
                  - key: gloo
                    operator: In
                    values:
                      - gloo

# Discovery service
# BREAKING CHANGE in v1.20: Discovery is disabled by default
# We need it enabled for automatic Upstream creation from K8s Services
discovery:
  enabled: true
  deployment:
    replicas: 2
    image:
      repository: kgateway-discovery
      tag: "1.20.9"
      pullPolicy: IfNotPresent
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    nodeSelector:
      kubernetes.io/arch: amd64

# Gateway proxy (Envoy)
gatewayProxies:
  gatewayProxy:
    disabled: false
    kind:
      deployment:
        replicas: 2
    service:
      type: ClusterIP  # For ALB integration
      httpPort: 80
      httpsPort: 443
    podTemplate:
      image:
        repository: kgateway-envoy
        tag: "1.20.9"
        pullPolicy: IfNotPresent
      resources:
        requests:
          memory: "263Mi"
          cpu: "50m"
        limits:
          memory: "263Mi"
          cpu: "200m"
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - gloo
                    - key: gloo
                      operator: In
                      values:
                        - gateway-proxy

# Settings
settings:
  create: true
  writeNamespace: support
  # Enable Gateway API support
  gateway:
    enabled: true
    validation:
      enabled: true
      alwaysAcceptResources: false
  # ExtAuth configuration for user-service authentication
  extauth:
    extauthzServerRef:
      name: sharpershape-user-service-80
      namespace: support
    httpService:
      pathPrefix: /internal/authorize
      request:
        allowedHeaders:
          - authorization
          - cookie
          - origin
          - x-csrf-token
          - x-forwarded-for
          - x-forwarded-host
          - x-forwarded-proto
          - x-forwarded-port
          - x-request-id
      response:
        allowedUpstreamHeaders:
          - internal-token
          - original-token
        allowedClientHeaders:
          - content-type
          - access-control-allow-origin
          - access-control-allow-credentials
          - access-control-allow-methods
          - access-control-allow-headers
    requestTimeout: 3s

# Ingress controller (disable, we're using Gateway API)
ingress:
  enabled: false

# Ingress proxy (disable, we're using Gateway API)
ingressProxy:
  disabled: true

# Jobs - use upstream images temporarily until added to base-images
gateway:
  certGenJob:
    image:
      registry: quay.io
      repository: solo-io/certgen
      tag: "1.20.9"
      pullPolicy: IfNotPresent

# kubectl image for jobs
kubectl:
  image:
    registry: quay.io
    repository: solo-io/kubectl
    tag: "1.20.9"
    pullPolicy: IfNotPresent

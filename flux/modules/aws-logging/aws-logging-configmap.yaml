apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-logging
  namespace: aws-observability
data:
  output.conf: |
    [OUTPUT]
        Name              cloudwatch_logs
        Match             *
        region            eu-west-1
        log_group_name    /aws/eks/fargate/logs
        log_stream_prefix fargate-
        auto_create_group true

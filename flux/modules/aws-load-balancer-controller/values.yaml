replicaCount: 1

clusterName: configured-by-cluster-information
region: configured-by-cluster-information
vpcId: configured-by-cluster-information

enableCertManager: true

# No serviceAccount role-arn annotation: the IAM role is bound through an
# EKS Pod Identity association in Terraform (aws/envs/eu-dev).

podSecurityContext:
  fsGroup: 1337
  runAsUser: 10050
  runAsGroup: 10050

resources:
  limits:
    cpu: 200m
    memory: 500Mi
    ephemeral-storage: 10Mi
  requests:
    cpu: 100m
    memory: 200Mi
    ephemeral-storage: 1Mi

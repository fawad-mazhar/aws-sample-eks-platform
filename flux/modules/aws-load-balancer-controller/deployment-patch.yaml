apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: aws-load-balancer-controller
          args:
            - --cluster-name=$(CLUSTER_NAME)
            - --ingress-class=alb
            - --aws-region=$(AWS_REGION)
            - --aws-vpc-id=$(AWS_VPC_ID)
          env:
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: cluster-information
                  key: cluster-name
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: cluster-information
                  key: aws-region
            - name: AWS_VPC_ID
              valueFrom:
                configMapKeyRef:
                  name: cluster-information
                  key: aws-vpc-id

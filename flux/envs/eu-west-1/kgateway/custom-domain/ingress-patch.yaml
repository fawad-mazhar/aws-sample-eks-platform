# Adds TLS on the ALB and limits routing to the app hostname. `rules` has no
# merge key, so this list replaces the default catch-all rule.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kgateway-alb
  namespace: kgateway
  annotations:
    # TLS configuration (ALB terminates TLS; the backend stays HTTP)
    alb.ingress.kubernetes.io/certificate-arn: ${ACM_CERTIFICATE_ARN}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'

    # SSL redirect
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": {"Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
spec:
  rules:
    # SSL redirect rule
    - host: ${APP_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ssl-redirect
                port:
                  name: use-annotation
    # Main traffic rule
    - host: ${APP_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-proxy
                port:
                  number: 80

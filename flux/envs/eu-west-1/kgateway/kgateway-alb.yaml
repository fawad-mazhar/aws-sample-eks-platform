# Default (no custom domain): plain HTTP on the ALB's own DNS name, every Host
# header routed to gateway-proxy. The opt-in custom-domain component
# (./custom-domain) adds the hostname rule, the HTTPS listener with the ACM
# certificate, and the HTTP->HTTPS redirect.
#
# ENV_PREFIX below is substituted by Flux from the flux-system/cluster-vars
# ConfigMap (or locally by bin/render.sh).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kgateway-alb
  namespace: kgateway
  annotations:
    # ALB ingress group
    alb.ingress.kubernetes.io/group.name: ${ENV_PREFIX}-ingress

    # Network configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

    # Backend uses HTTP
    alb.ingress.kubernetes.io/backend-protocol: HTTP

    # Health check configuration — /healthz is a direct-response route that
    # matches regardless of Host header (the ALB health check sends none).
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200-399"

    # Load balancer settings
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http2.enabled=true

    # Tags
    alb.ingress.kubernetes.io/tags: environment=dev
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-proxy
                port:
                  number: 80

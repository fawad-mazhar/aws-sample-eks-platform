apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../modules/kgateway
  # The chart rollout creates the gateway.solo.io/v1 Gateway resources for
  # this Gloo Edge classic control plane.
  - sample-app-vs.yaml
  - kgateway-alb.yaml
# Opt-in: hostname + HTTPS on the ALB. Requires TF_VAR_domain_name and
# TF_VAR_acm_certificate_arn in .env (see custom-domain/kustomization.yaml).
components:
  - custom-domain

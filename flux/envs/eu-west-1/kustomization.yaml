apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../modules/aws-csi
  - ../../modules/aws-logging
  - ../../modules/aws-load-balancer-controller
  - ../../modules/prometheus
  - ../../modules/keda
  - ../../modules/nats
  - ../../modules/cluster-autoscaler
  - ../../modules/karpenter-crds
  - ../../modules/karpenter
  - ../../modules/karpenter-config
  - ../../modules/cloudnative-pg
  - ../../modules/sample-app
  - cert-manager
  - kgateway
  # keda-demo (ScaledObject) and flux-system (Flux controllers + the
  # GitRepository/Kustomization set below) are intentionally NOT listed here
  # -- see their own kustomization.yaml comments for why.
  # cluster-information-configmap.yaml is intentionally NOT listed here: its
  # cluster-endpoint value can't be known until after `terraform apply`, so it
  # is generated and applied directly from Terraform outputs (see README.md
  # Step 3). The checked-in file is kept only as a schema reference — applying
  # it as-is would ship the PLACEHOLDER_UPDATE_AFTER_TERRAFORM_APPLY value.

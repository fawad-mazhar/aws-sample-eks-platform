# Reference/schema only — NOT applied directly (not listed in
# ../kustomization.yaml). cluster-endpoint is only known after `terraform
# apply`, so the real ConfigMap is generated from Terraform outputs and
# applied with `kubectl apply -f -`; see README.md Step 3. Applying this file
# as-is would ship the PLACEHOLDER_UPDATE_AFTER_TERRAFORM_APPLY value to
# Karpenter's CLUSTER_ENDPOINT env var.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-information
  namespace: kube-system
data:
  cluster-name: nlaclassic-eu-west-1-eks
  aws-region: eu-west-1
  aws-vpc-id: vpc-00e377b27a8a29ba1
  cluster-endpoint: PLACEHOLDER_UPDATE_AFTER_TERRAFORM_APPLY
  karpenter-queue: nlaclassic-eu-west-1-karpenter

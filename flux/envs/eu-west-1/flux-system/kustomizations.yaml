spec:
  interval: 10m
  path: ./flux/modules/aws-load-balancer-controller
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager # webhook TLS
  sourceRef:
    kind: GitRepository
    name: aws-sample-eks-platform
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/modules/cloudnative-pg
  prune: true
  wait: true
  dependsOn:
    - name: crds
  sourceRef:
    kind: GitRepository
    name: aws-sample-eks-platform
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kgateway
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/envs/eu-west-1/kgateway
  prune: true
  wait: false # Gloo Edge Settings/VirtualService/Gateway: kstatus can't assess these CRD kinds
  dependsOn:
    - name: crds
    - name: cloudnative-pg
  sourceRef:
    kind: GitRepository
    name: aws-sample-eks-platform
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sample-app
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/modules/sample-app
  prune: true
  wait: true
  dependsOn:
    - name: cloudnative-pg
    - name: kgateway
  sourceRef:
    kind: GitRepository
    name: aws-sample-eks-platform
